<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vikas Yadav — Life Coach OS</title>
<meta name="description" content="Personal life-coach dashboard for Vikas Yadav: M.Pharm QA + Avzera freelance + QA lab / API business plan, 2026–2031.">
<meta name="theme-color" content="#060a09">
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/dm-sans-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/instrument-serif-latin.woff2" crossorigin>
<link rel="stylesheet" href="coach.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060a09'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%232dd4a7' text-anchor='middle' font-style='italic'%3EV%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-brand">
      <span class="brand-mark">V</span>
      <div><b>COACH OS</b><small>VIKAS YADAV · 2026–31</small></div>
    </div>
    <nav class="side-nav" id="sideNav" aria-label="Coach views">
      <button data-view="overview" class="is-active"><i>◈</i>Overview</button>
      <button data-view="roadmap"><i>↗</i>Roadmap</button>
      <button data-view="daily"><i>◷</i>Daily plan</button>
      <button data-view="tasks"><i>✓</i>Tasks</button>
      <button data-view="habits"><i>▦</i>Habits</button>
      <button data-view="avzera"><i>▲</i>Avzera growth</button>
      <button data-view="lab"><i>⚗</i>QA lab / API</button>
      <button data-view="mastery"><i>≡</i>Mastery tracks</button>
      <button data-view="review"><i>✎</i>Weekly review</button>
      <button data-view="profile"><i>◉</i>Profile</button>
    </nav>
    <div class="side-foot">
      <a href="../index.html">← Portfolio</a>
      <button id="resetBtn" title="Reset all local data to the seeded plan">Reset data</button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="top-title">
        <span class="eyebrow" id="topEyebrow">NORTH STAR</span>
        <h1 id="topTitle">Overview</h1>
      </div>
      <div class="top-chips">
        <span class="chip chip-teal" id="chipDate"></span>
        <span class="chip chip-amber" id="chipStreak"></span>
        <span class="chip chip-blue" id="chipBudget"></span>
      </div>
    </header>
    <main class="content" id="viewRoot" tabindex="-1"></main>
  </div>
</div>

<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Detail drawer" hidden>
  <div class="drawer-head">
    <span class="eyebrow" id="drawerKind">DETAIL</span>
    <button class="icon-btn" id="drawerClose" aria-label="Close drawer">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="coach.js"></script>
</body>
</html>
